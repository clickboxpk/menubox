<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4C45">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MenuQR">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MenuQR</title>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<script>if (window.top !== window.self) { document.documentElement.style.display = 'none'; try { window.top.location = window.self.location; } catch (e) {} }</script>
<script>if(location.hash.indexOf("#/r/")===0)location.replace("menu.html"+location.hash);</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14211F;--muted:#5E6F6C;--bg:#F6F3EC;--card:#fff;--brand:#0F4C45;--brand-2:#0B3A35;--saffron:#E8A317;--line:#E1DDD2;--err:#B3261E;--ok:#1B7F4B;--r:14px}
*{box-sizing:border-box;margin:0}
body{font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100dvh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em}
.hidden{display:none!important}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;min-height:46px;background:var(--brand);color:#fff;font-size:15px}
button:hover{background:var(--brand-2)}button:disabled{opacity:.6;cursor:wait}
button.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
button.danger{background:transparent;color:var(--err);border:1.5px solid var(--err)}
button.sm{min-height:38px;padding:8px 14px;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.field{margin-bottom:14px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#FCFBF8;color:var(--ink)}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(232,163,23,.4)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.err{color:var(--err);font-size:14px;margin-bottom:12px}

/* login */
.hero{background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 40px) 24px 56px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px}
.logo i{width:34px;height:34px;border-radius:9px;background:var(--saffron);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px}
.logo i b{background:var(--brand);border-radius:1px}
.logo i b:nth-child(2),.logo i b:nth-child(4),.logo i b:nth-child(6){background:transparent}
.hero h1{font-size:30px;line-height:1.1;margin-top:28px;max-width:14ch}
.hero p{margin-top:10px;color:#BFD6D2}
.logincard{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:0 10px 30px -12px rgba(15,76,69,.35);max-width:440px;margin:-28px 20px 28px}
@media(min-width:520px){.logincard{margin:-28px auto 28px}}

/* app shell */
.bar{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;justify-content:space-between;align-items:center}
.bar .logo{font-size:18px}.bar .logo i{width:28px;height:28px;padding:5px}
.bar button{background:rgba(255,255,255,.14);min-height:36px;padding:6px 12px;font-size:14px}
.page{max-width:720px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.page h2{font-size:22px;margin-bottom:14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.head h2{margin:0}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;background:none;color:var(--muted);border-radius:0;min-height:56px;font-size:13px;position:relative}
.nav button.on{color:var(--brand)}
.nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--saffron);border-radius:0 0 3px 3px}

/* content */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.stat{background:var(--card);border-radius:var(--r);padding:14px 16px;border:1px solid var(--line)}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:30px;line-height:1}
.stat span{color:var(--muted);font-size:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item h3{font-size:17px}
.item p{font-size:14px;color:var(--muted);margin-top:3px;word-break:break-word}
.item .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.badge{font-size:12.5px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap;background:#E8F1EF;color:var(--brand)}
.badge.bad{background:#FBE4E2;color:var(--err)}.badge.warn{background:#FFF1CC;color:#7A5600}.badge.prem{background:#FCE9B8;color:#6B4E00}
.empty{text-align:center;color:var(--muted);padding:36px 12px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{background:#E8F1EF;color:var(--brand);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600}

/* bottom sheet */
.back{position:fixed;inset:0;background:rgba(10,25,22,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-size:21px;margin-bottom:16px}
.perms{display:grid;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.chk{display:flex;align-items:center;gap:12px;padding:10px 0;font-weight:500;margin:0;font-size:15px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--brand)}
.sheet .row{display:flex;gap:10px;margin-top:18px}.sheet .row button{flex:1}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;z-index:30;max-width:90vw}

/* restaurant dashboard */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
.chip{flex:none;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:99px;min-height:38px;padding:6px 14px;font-size:14px}
.chip:hover{background:#fff}.chip.on,.chip.on:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.dish{display:flex;gap:12px}
.thumb{width:68px;height:68px;border-radius:12px;background:#E8F1EF;flex:none;object-fit:cover;display:grid;place-items:center;color:var(--brand);font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:24px}
.item p.price{font-weight:600;color:var(--ink)}
.imgbox{display:flex;gap:12px;align-items:center}.imgbox .thumb{width:84px;height:84px}
input:disabled,select:disabled{background:#EFECE4;color:#8A9693}
input[type=color]{padding:4px;height:48px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 8px 20px -6px rgba(15,76,69,.6);border-radius:99px;padding:0 20px;min-height:50px}

/* qr + stats + print */
.qrprev{width:100%;max-width:320px;height:auto;display:block;margin:12px auto;border:1px solid var(--line);border-radius:12px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}
.bars div{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:3px}
.barl{display:flex;gap:4px;margin-top:4px}.barl span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
#printArea{display:none}
@media print{body>*:not(#printArea):not(#rcptPrint){display:none!important}
#printArea:empty{display:none!important}
#printArea{display:grid!important;grid-template-columns:1fr 1fr;gap:8mm;padding:8mm}
#printArea.one{grid-template-columns:1fr;max-width:130mm;margin:0 auto}
.pc{break-inside:avoid}.pc img{width:100%;display:block;border:1px solid #ccc}}
.banner{background:#FFF1CC;color:#6B4E00;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.4}
.banner.bad{background:#FBE4E2;color:#8A1C14}.banner button{margin-top:10px}
.bar .r{display:flex;gap:8px}
.annban{display:flex;gap:10px;align-items:flex-start;background:#E3F0FF;color:#0B3A6B;border-radius:14px;padding:12px 8px 12px 14px;margin-bottom:14px;font-size:14.5px;line-height:1.45;border:1px solid #B9D8F7}
.annban .am{flex:1;white-space:pre-line;overflow-wrap:anywhere}.annban .am b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.annban button{flex:none;min-height:36px;min-width:36px;padding:0;background:transparent;color:#0B3A6B;font-size:22px;line-height:1;border-radius:99px}.annban button:hover{background:#CFE4FA}
.instban{display:flex;gap:10px;align-items:center;background:#E8F1EF;color:#0F4C45;border-radius:14px;padding:10px 8px 10px 14px;margin-bottom:14px;font-size:14px;line-height:1.4;border:1px solid #BFD9D4}
.instban .im{flex:1}.instban .im small{display:block;opacity:.8;font-size:12.5px}
.instban button.sm{flex:none}.instban .x{flex:none;min-height:36px;min-width:36px;padding:0;background:transparent;color:#0F4C45;font-size:22px;line-height:1;border-radius:99px}.instban .x:hover{background:#CFE4DF}
.logincard .instban{margin:14px 0 0}
.chklist{max-height:200px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff}
.bkban{background:#C62828;color:#fff;border-radius:16px;padding:18px;margin-bottom:16px;line-height:1.45;box-shadow:0 8px 20px -10px #C62828}
.bkban b{display:block;font-size:22px;margin-bottom:6px}.bkban span{display:block;font-size:15px;opacity:.95}
.bkban button{margin-top:12px;background:#fff;color:#C62828;font-weight:800}.bkban button:hover{background:#FFE9E7}
button.bkbig{width:100%;min-height:60px;font-size:18px;font-weight:800;border-radius:14px;margin-top:6px}

.note{font-style:italic;color:#6B4E00!important}
.orow{display:grid;grid-template-columns:1fr 96px 44px;gap:6px;margin-bottom:6px}
.orow button{padding:0;min-height:46px}
.hrow2{display:grid;grid-template-columns:34px 74px minmax(0,1fr) minmax(0,1fr);gap:5px;align-items:center;margin-bottom:6px}
.hrow2 b{font-size:14px}.hrow2 .chk{margin:0;padding:0;font-size:13px;gap:6px}.hrow2 .chk input{width:20px;height:20px}
.hrow2 input[type=time]{padding:8px 4px;font-size:14px;min-width:0}
input[type=time],input[type=color],input[type=file]{min-width:0;max-width:100%}.item{min-width:0}
.tagpick{display:flex;flex-wrap:wrap;gap:4px 16px}
.tagpick .chk{padding:6px 0}
.item s{color:var(--muted);font-weight:400}
.seg2{display:flex;background:#E8E4D8;border-radius:12px;padding:4px;margin-bottom:14px;gap:4px}
.seg2 button{flex:1;background:transparent;color:var(--muted);min-height:38px;padding:6px}
.seg2 button:hover{background:transparent}.seg2 button.on,.seg2 button.on:hover{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.crow{border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:#fff}
.crow .cr1{display:grid;grid-template-columns:minmax(0,1fr) 76px 84px;gap:6px}
.crow .ca{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;margin-top:6px}
.crow .ca .chk{padding:6px 0;font-size:14px;gap:7px}.crow .ca .chk input{width:20px;height:20px}
.logoBox{display:flex;align-items:center;gap:14px;margin:10px 0}
.logoBox img,.logoBox .ph{width:76px;height:76px;border-radius:18px;object-fit:cover;background:#fff;box-shadow:0 0 0 1.5px var(--line);flex:none}
.logoBox .ph{display:grid;place-items:center;font-size:30px;font-weight:700;color:var(--brand);background:#EFECE4}
.logoBox input[type=file]{padding:8px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView">
  <header class="hero">
    <div class="logo"><i><b></b><b></b><b></b><b></b><b></b><b></b></i>MenuQR</div>
    <h1>Your menu, one scan away.</h1>
    <p>Sign in to manage your restaurant.</p>
  </header>
  <section class="logincard">
    <h2 style="font-size:22px;margin-bottom:16px">Sign in</h2>
    <form id="loginForm" novalidate>
      <div class="field"><label for="username">Username</label><input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div>
      <p class="err" id="err" role="alert"></p>
      <button id="submit" type="submit" style="width:100%">Sign in</button>
    </form>
    <div id="instL"></div>
    <p class="hint" style="margin-top:14px;text-align:center">By signing in you agree to the <a href="terms.html" target="_blank" rel="noopener">Service Agreement</a>.</p>
  </section>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <div class="bar">
    <div class="logo"><i><b></b><b></b><b></b><b></b><b></b><b></b></i><span id="barTitle">MenuQR</span></div>
    <div class="r"><button data-act="pw">Password</button><button data-act="logout">Sign out</button></div>
  </div>
  <div id="instA" style="padding:12px 16px 0"></div>
  <main class="page" id="page"></main>
  <nav class="nav" id="nav"></nav>
</div>

<div id="sheetHost"></div>
<div id="printArea"></div>

<script src="config.js"></script>
<script src="receipt.js"></script>
<script src="backup.js"></script>
<script>
const API = window.APP_CONFIG.API_URL, KEY = 'menuqr_token';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PERM_LABELS = {
  'menu.edit':'Edit item name, description and tags','price.edit':'Change prices, sizes and extras','image.upload':'Upload pictures',
  'items.add':'Add new items','items.delete':'Delete items','categories.manage':'Manage categories',
  'availability.toggle':'Mark items available or sold out','whatsapp.edit':'Change WhatsApp number',
  'ordering.edit':'Change order types, delivery fee, taxes and minimum order','hours.edit':'Change opening hours',
  'theme.edit':'Change logo and colors','qr.download':'Download QR codes and manage tables','analytics.view':'See statistics and feedback (Premium plan)',
  'orders.view':'See orders, receipts and sales reports (reports need Premium)','billing.view':'See billing history and download payment receipts','backup.manage':'Backup Center: download backups'
};
const S = { ann:{ list:[], now:'', loading:false }, annLive:[], ord:{ range:'7', from:'', to:'', list:null, report:null, err:'' }, billing:null, mview:'items', pay:{ payments:[], months:[], total_all:0, this_month:'' }, act:[], me:null, rest:null, plans:[], rests:[], users:[], tab:'home', cats:[], items:[], tables:[], stats:null, info:null, cat:'all', rtab:'menu' };
const can = (p) => S.me.permissions.includes(p);

async function api(path, method = 'GET', body) {
  const token = localStorage.getItem(KEY);
  const res = await fetch(API + path, { method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || 'Something went wrong.'), { status: res.status });
  return data;
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function view(v) { $('loginView').classList.toggle('hidden', v !== 'login'); $('appView').classList.toggle('hidden', v !== 'app'); }

/* ---------- bottom sheet ---------- */
function openSheet(title, html, onSave, extra) {
  $('sheetHost').innerHTML = `<div class="back" data-act="close"><form class="sheet" id="sheetForm" novalidate>
    <h2>${esc(title)}</h2>${html}<p class="err" id="sheetErr" role="alert"></p>
    <div class="row"><button type="button" class="ghost" data-act="close">Cancel</button><button type="submit">Save</button></div>
    ${extra || ''}</form></div>`;
  const f = $('sheetForm');
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); const b = f.querySelector('[type=submit]'); b.disabled = true; $('sheetErr').textContent = '';
    try { const r = await onSave(f); closeSheet(); await refresh(); toast(typeof r === 'string' ? r : 'Saved'); }
    catch (er) { $('sheetErr').textContent = er.message; b.disabled = false; }
  });
}
const closeSheet = () => { $('sheetHost').innerHTML = ''; };
const fv = (f) => Object.fromEntries(new FormData(f));

/* ---------- helpers ---------- */
function expiry(r) {
  if (!r.plan_expires_at) return { t: 'No expiry date', c: '' };
  const days = Math.ceil((new Date(r.plan_expires_at) - new Date()) / 864e5);
  if (days < 0) return { t: 'Expired on ' + r.plan_expires_at, c: 'bad' };
  if (days <= 7) return { t: `Expires in ${days} day${days === 1 ? '' : 's'}`, c: 'warn' };
  return { t: 'Valid until ' + r.plan_expires_at, c: '' };
}
const planOpts = (sel) => S.plans.map((p) => `<option value="${p.id}" ${p.id == sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');

/* ---------- ADMIN: tabs ---------- */
function homeTab() {
  const active = S.rests.filter((r) => r.status === 'active').length;
  const prem = S.rests.filter((r) => r.plan_code === 'premium').length;
  const trials = S.rests.filter((r) => r.is_trial && r.plan_state !== 'expired').length;
  const cur = (S.pay.months.find((m) => m.ym === S.pay.this_month) || { total: 0 }).total;
  const need = S.rests.filter((r) => r.plan_code !== 'free' && ['bad', 'warn'].includes(expiry(r).c));
  return `<h2>Overview</h2><div class="stats">
    <div class="stat"><b>${S.rests.length}</b><span>Restaurants</span></div>
    <div class="stat"><b>${active}</b><span>Active</span></div>
    <div class="stat"><b>${prem}</b><span>On Premium</span></div>
    <div class="stat"><b>${trials}</b><span>On free trial</span></div>
    <div class="stat"><b>${S.users.length}</b><span>Restaurant users</span></div>
    <div class="stat"><b>${Number(cur).toLocaleString()}</b><span>Rs collected this month</span></div></div>
    <h2 style="font-size:18px">Renewals to follow up</h2>
    ${need.length ? need.map((r) => `<div class="item"><div class="top"><h3>${esc(r.name)}</h3><span class="badge ${expiry(r).c}">${expiry(r).t}</span></div>
      <p>${esc(r.plan_name)} plan${r.is_trial ? ' (free trial)' : ''}${r.whatsapp ? ', WhatsApp ' + esc(r.whatsapp) : ''}</p>${renewActs(r)}</div>`).join('')
      : '<div class="empty">No plans are ending in the next 7 days.</div>'}
    <h2 style="font-size:18px;margin-top:24px">Recent activity</h2>
    ${S.act.length ? actList(S.act) : '<div class="empty">Nothing has happened yet.</div>'}`;
}
function restsTab() {
  return `<div class="head"><h2>Restaurants</h2><button class="sm" data-act="new-rest">Add restaurant</button></div>` +
  (S.rests.length ? S.rests.map((r) => { const e = expiry(r); return `<article class="item">
    <div class="top"><h3>${esc(r.name)}</h3><span class="badge ${r.status === 'active' ? '' : 'bad'}">${r.status === 'active' ? 'Active' : 'Suspended'}</span></div>
    <p>Menu link name: ${esc(r.slug)}</p>
    <p>${esc(r.plan_name)} plan${r.is_trial ? ' (free trial)' : ''}. <span class="badge ${e.c}">${e.t}</span> ${r.plan_state === 'expired' ? '<span class="badge bad">Premium features off</span>' : ''}</p>
    <p>${r.item_count} items, ${r.user_count} users, ${r.scan_count} menu views</p>
    ${r.admin_notes ? `<p class="note">Note: ${esc(r.admin_notes)}</p>` : ''}
    <div class="acts"><button class="ghost sm" data-act="edit-rest" data-id="${r.id}">Edit</button>
    <button class="ghost sm" data-act="pay-new" data-id="${r.id}">Payment</button>
    ${r.plan_code !== 'free' ? `<button class="ghost sm" data-act="renew" data-id="${r.id}">Renew</button>` : ''}

let IMPORT_ROWS = [];
const XLSX_URLS = ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => { let k = 0;
    const next = () => { if (k >= XLSX_URLS.length) return rej(new Error('The Excel reader could not be loaded. Please save the file as CSV and try again.'));
      const sc = document.createElement('script'); sc.src = XLSX_URLS[k++]; sc.onload = res; sc.onerror = next; document.head.appendChild(sc); };
    next(); });
}
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '', d = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function rowsFromMatrix(m) {
  const norm = (h) => String(h).toLowerCase().replace(/[^a-z]/g, '');
  const map = { category: 'category', item: 'name', itemname: 'name', name: 'name', description: 'description', price: 'price', sizes: 'sizes', size: 'sizes',
    addons: 'addons', extras: 'addons', tags: 'tags', originalprice: 'old_price', oldprice: 'old_price' };
  const head = (m[0] || []).map((h) => map[norm(h)]);
  if (!head.includes('name')) throw new Error('The first row must contain column names, including "Item". Download the sample file to see the format.');
  return m.slice(1).map((r) => { const o = {}; head.forEach((k, i) => { if (k) o[k] = String(r[i] ?? '').trim(); }); return o; }).filter((o) => Object.values(o).some((v) => v));
}
function downloadText(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function importSheet(url, who) {
  IMPORT_ROWS = [];
  openSheet('Import menu' + (who ? ' for ' + who : ''), `
    <p class="hint" style="margin-bottom:12px">Upload an Excel (.xlsx) or CSV file. Categories are created automatically. Your existing items are not changed.</p>
    <button type="button" class="ghost sm" data-act="dl-template">Download sample file</button>
    <div class="field" style="margin-top:14px"><label>Choose your file</label><input type="file" id="impFile" accept=".csv,.xlsx,.xls"></div>
    <div id="impPrev"></div>
    <p class="hint">Sizes look like <b>Half:600|Full:1100</b>. Extras look like <b>Extra cheese:50|Raita:40</b>. Tags can be spicy, veg, halal, special. At most 300 items at a time.</p>`,
    async () => { if (!IMPORT_ROWS.length) throw new Error('Please choose a file first.');
      const res = await api(url, 'POST', { rows: IMPORT_ROWS });
      if (res.errors && res.errors.length) alert(`${res.added} items imported. These rows were skipped:\n\n` + res.errors.join('\n'));
      return `${res.added} items imported`; });
  $('sheetForm').querySelector('[type=submit]').textContent = 'Import';
  $('impFile').addEventListener('change', async (e) => {
    const file = e.target.files[0], box = $('impPrev'); if (!file) return;
    box.innerHTML = '<p class="hint">Reading the file…</p>';
    try {
      let m;
      if (/\.xlsx?$/i.test(file.name)) { await loadXLSX(); const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
        m = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' }); }
      else m = parseCSV(await file.text());
      IMPORT_ROWS = rowsFromMatrix(m);
      const cats = new Set(IMPORT_ROWS.map((r) => (r.category || '').toLowerCase()).filter(Boolean)).size;
      box.innerHTML = IMPORT_ROWS.length ? `<div class="banner" style="background:#E8F1EF;color:#0F4C45"><b>${IMPORT_ROWS.length} items</b> found in ${cats} categor${cats === 1 ? 'y' : 'ies'}.<br>First items: ${IMPORT_ROWS.slice(0, 3).map((r) => esc(r.name)).join(', ')}${IMPORT_ROWS.length > 3 ? '…' : ''}</div>`
        : '<p class="err">No items were found in this file.</p>';
    } catch (er) { IMPORT_ROWS = []; box.innerHTML = `<p class="err">${esc(er.message)}</p>`; }
  });
}

function shrink(file, max = 800, quality = 0.78) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => rej(new Error('This picture could not be opened.')); img.src = u;
  });
}

const QR_URLS = ['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js', 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'];
function loadQR() {
  if (window.qrcode) return Promise.resolve();

    const next = () => { if (k >= QR_URLS.length) return rej(new Error('The QR library could not be loaded. Please check your internet and try again.'));
      const sc = document.createElement('script'); sc.src = QR_URLS[k++]; sc.onload = res; sc.onerror = next; document.head.appendChild(sc); };
    next(); });
}
const inkOn = (hex) => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 160 ? '#14211F' : '#FFFFFF'; };

async function drawCard(url, title, sub) {
  await loadQR();

  const W = 1000, H = 1300, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const color = qrColor(), F = '"Bricolage Grotesque", Arial, sans-serif';
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.fillStyle = color; x.fillRect(0, 0, W, 230);
  x.fillStyle = inkOn(color); x.textAlign = 'center'; x.textBaseline = 'middle';
  let fs = 88; do { x.font = `700 ${fs}px ${F}`; fs -= 4; } while (x.measureText(title).width > 880 && fs > 30);
  x.fillText(title, W / 2, 118);
  x.fillStyle = '#14211F'; x.font = `700 58px ${F}`; x.fillText('Scan to see our menu', W / 2, 322);
  const n = qr.getModuleCount(), cell = Math.floor(720 / (n + 8)), qs = cell * (n + 8), qx = (W - qs) / 2, qy = 380;
  x.fillStyle = '#111';
  for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) if (qr.isDark(r, q)) x.fillRect(qx + (q + 4) * cell, qy + (r + 4) * cell, cell, cell);
  x.fillStyle = '#5E6F6C'; x.font = `500 40px Arial, sans-serif`; x.fillText('Then order on WhatsApp in a few taps', W / 2, qy + qs + 60);
  if (sub) { x.fillStyle = color; x.beginPath(); x.roundRect ? x.roundRect(250, 1100, 500, 130, 65) : x.rect(250, 1100, 500, 130); x.fill();
    x.fillStyle = inkOn(color); x.font = `700 70px ${F}`; x.fillText(sub, W / 2, 1167); }
  return c;
}

    else if (act === 'contact-renew') window.open('https://wa.me/' + window.APP_CONFIG.SUPPORT_WHATSAPP.replace(/\D/g, '') + '?text=' + encodeURIComponent(`Assalam o Alaikum! I would like to renew the MenuQR plan for ${S.info.name}.`), '_blank');
    else if (act === 'pay-new') payForm(id);
    else if (act === 'pay-del') { if (confirm('Delete this payment record? The plan date is not changed.')) { await api('/api/admin/payments/' + id, 'DELETE'); await refresh(); toast('Deleted'); } }
    else if (act === 'activity') { const r = S.rests.find((x) => x.id == id); const d = await api('/api/admin/activity?restaurant_id=' + id + '&limit=50');
      infoSheet('Activity: ' + r.name, d.activity.length ? actList(d.activity) : '<div class="empty">Nothing has happened yet.</div>'); }
    else if (act === 'import-admin') { const r = S.rests.find((x) => x.id == id); importSheet('/api/admin/restaurants/' + id + '/import', r.name); }
    else if (act === 'import-r') importSheet('/api/r/import');
    else if (act === 'dl-template') downloadText('menu-sample.csv', 'Category,Item,Description,Price,Sizes,Add-ons,Tags,Original price\nStarters,Chicken Samosa,Crispy and spicy,250,,,spicy,\nBBQ,Chicken Tikka,Charcoal grilled,,Half:600|Full:1100,Extra raita:40|Naan:30,"halal,special",\nDrinks,Mint Margarita,Fresh mint and lemon,180,,,veg,220\n');
    else if (act === 'add-charge') { const box = $('chargeRows'); if (box.children.length >= +box.dataset.max) toast('Your plan allows up to ' + box.dataset.max + ' charges.'); else box.insertAdjacentHTML('beforeend', chargeRow(null, true)); }
    else if (act === 'rm-charge') el.closest('.crow').remove();
    else if (act === 'save-charges') { await api('/api/r/settings', 'PUT', { charges: collectCharges() }); await refresh(); toast('Charges saved'); }
    else if (act === 'theme-reset') { if (confirm('Restore the default colors for your menu?')) { const b = { theme_primary: '#0F4C45' }; if (S.info.custom_theme) b.theme_accent = '#0F4C45';
      await api('/api/r/settings', 'PUT', b); await refresh(); toast('Default colors restored'); } }
    else if (act === 'logo-del') { if (confirm('Remove your logo?')) { await api('/api/r/logo', 'DELETE'); await refresh(); toast('Logo removed'); } }
    else if (act === 'terms-go') { el.disabled = true; try { await api('/api/auth/accept-terms', 'POST', { version: S.me.terms_required }); S.me.terms_ok = true; closeSheet(); await refresh(); toast('Thank you'); } catch (er) { $('tErr').textContent = er.message; el.disabled = false; } }
    else if (act === 'add-size') addOptRow('sizes', '', '');
    else if (act === 'add-addon') addOptRow('addons', '', '');
    else if (act === 'rm-row') { el.closest('.orow').remove(); syncPriceLock(); }
    else if (act === 'copy-mon') { DAYS.slice(1).forEach(([d]) => { $('hc_' + d).checked = $('hc_mon').checked; $('ho_' + d).value = $('ho_mon').value; $('hx_' + d).value = $('hx_mon').value; }); syncHours(); }
    else if (act === 'perm-all') { const b = [...document.querySelectorAll('[name=perm]')]; const all = b.every((c) => c.checked); b.forEach((c) => c.checked = !all); }
  } catch (er) { toast(er.message); }
});

// the logo is made small here (a square-ish JPEG of about 10 to 40 KB) before it is sent
function logoData(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 160 / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(u);
      let q = 0.88, out = c.toDataURL('image/jpeg', q);
      while (out.length > 55000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      out.length > 58000 ? rej(new Error('This picture is too detailed. Please choose a simpler logo.')) : res(out);
    };
    img.onerror = () => rej(new Error('This picture could not be opened.')); img.src = u;
  });
}
async function uploadLogo(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  try { toast('Saving your logo…'); await api('/api/r/logo', 'PUT', { data: await logoData(f) }); await refresh(); toast('Logo saved'); }
  catch (er) { toast(er.message); inp.value = ''; }
}
document.addEventListener('change', (e) => {
  const id = e.target.id || '';
  if (id === 'hEn' || id.startsWith('hc_')) syncHours();
  if (id === 'sLogo') uploadLogo(e.target);
  if (e.target.name === 'audience' && $('annTargets')) $('annTargets').classList.toggle('hidden', e.target.value !== 'selected');
  if (id === 'tAgree') $('tGo').disabled = !e.target.checked;
  if (id === 'trialChk') document.querySelectorAll('#sheetForm [name=plan_id], #sheetForm [name=plan_expires_at]').forEach((x) => { x.disabled = e.target.checked; });
});

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); $('err').textContent = '';
  $('submit').disabled = true; $('submit').textContent = 'Signing in…';
  try {
    const { token } = await api('/api/auth/login', 'POST', { username: $('username').value, password: $('password').value });
    localStorage.setItem(KEY, token); $('password').value = ''; S.tab = 'home'; await boot();
  } catch (er) { $('err').textContent = er.message; }
  finally { $('submit').disabled = false; $('submit').textContent = 'Sign in'; }
});

localStorage.getItem(KEY) ? boot() : view('login');
</script>
