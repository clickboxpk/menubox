<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E" id="themeMeta">
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand:#0F766E;--on-brand:#fff;--accent:#F59E0B;--on-accent:#14211F;--ink:#1B2524;--muted:#68767A;--bg:#FAF8F3;--card:#fff;--line:#E7E3D8}
*{box-sizing:border-box;margin:0}
body{font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100dvh}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:10px 16px;font-size:15px;background:var(--brand);color:var(--on-brand)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:640px;margin:0 auto}
header.top{background:var(--brand);color:var(--on-brand);padding:calc(env(safe-area-inset-top) + 28px) 20px 22px}
header.top h1{font-size:30px;line-height:1.1}
header.top p{opacity:.85;margin-top:6px;font-size:15px}
.hrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.tbl{display:inline-block;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:600}
.wait{background:rgba(255,255,255,.16);color:var(--on-brand);border:1.5px solid rgba(255,255,255,.55);min-height:34px;padding:4px 14px;font-size:14px;border-radius:99px}
.closed{background:#FBE4E2;color:#8A1C14;border-radius:14px;padding:12px 14px;margin:14px 0 4px;font-size:15px;line-height:1.4}
.closed b{display:block}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 8px}
.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;color:var(--ink);border:1.5px solid var(--line);min-height:38px;padding:6px 14px;border-radius:99px;font-size:14px}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
main{padding:6px 16px calc(120px + env(safe-area-inset-bottom))}
section{scroll-margin-top:120px}
section h2{font-size:22px;margin:22px 0 10px}
.dish{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.dish .pic{width:92px;height:92px;border-radius:12px;object-fit:cover;flex:none;background:#EEF3F1}
.dish .info{flex:1;min-width:0;display:flex;flex-direction:column}
.dish h3{font-size:17px;line-height:1.25}
.dish .desc{font-size:14px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tg{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tg span{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:#EEF3F1;color:#2F4A46}
.tg .spicy{background:#FDE3DC;color:#A32A12}.tg .veg{background:#DDF1E1;color:#17652D}.tg .halal{background:#E3EEFB;color:#1D4F8F}.tg .special{background:var(--accent);color:var(--on-accent)}
.dish .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;gap:8px;flex-wrap:wrap}
.price{font-weight:600;font-size:16px}.old{color:var(--muted);font-weight:400;font-size:14px;text-decoration:line-through;margin-left:6px}
.from{font-weight:400;font-size:13px;color:var(--muted)}
.add{background:#fff;color:var(--brand);border:1.5px solid var(--brand);min-height:40px;padding:6px 20px}
.inord{font-size:13px;color:var(--brand);font-weight:600;margin-right:8px}
.step{display:flex;align-items:center;background:var(--brand);color:var(--on-brand);border-radius:12px}
.step button{background:transparent;color:inherit;min-height:40px;width:42px;padding:0;font-size:20px}
.step b{min-width:24px;text-align:center}
.dish.off{opacity:.55}.dish.off .pic{filter:grayscale(1)}
.sold{font-size:13px;font-weight:600;color:#9A3412}
.state{text-align:center;padding:60px 24px;color:var(--muted)}
.state h2{color:var(--ink);margin-bottom:8px}
.fb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:26px;text-align:center}
.fb h2{font-size:19px;margin:0 0 4px}.fb p{color:var(--muted);font-size:14px}
.stars{display:flex;justify-content:center;gap:4px;margin:10px 0}
.stars button{background:transparent;color:#CFC9B8;font-size:34px;min-height:48px;width:48px;padding:0;line-height:1}
.stars button.on{color:var(--accent)}
.fb textarea{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0 10px;resize:none}

.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:8;max-width:616px;margin:0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:12px;width:calc(100% - 24px);min-height:60px;padding:10px 12px 10px 18px;
  background:var(--ink);color:#fff;border-radius:18px;box-shadow:0 12px 30px -8px rgba(0,0,0,.45)}
.cartbar:hover{background:var(--ink)}
.cartbar span{text-align:left;font-weight:500;font-size:15px;line-height:1.25}
.cartbar span b{display:block;font-size:17px}
.cartbar i{font-style:normal;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:11px 16px;font-weight:600}

.back{position:fixed;inset:0;background:rgba(10,20,20,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet h2{font-size:22px}
.x{background:transparent;color:var(--muted);font-size:15px;min-height:40px;padding:6px 8px}
.lbl{font-weight:600;font-size:14px;margin:14px 0 6px}
.optrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;font-weight:500}
.optrow.on{border-color:var(--brand);background:#F0F7F5}.optrow.on span::before{content:"\2713  ";color:var(--brand);font-weight:700}
.line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .n{flex:1;min-width:0}.line .n b{display:block;font-weight:600}.line .n small{color:var(--muted);font-size:14px}
.line .step{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.seg{display:flex;gap:6px;margin:14px 0 2px}
.seg button{flex:1;background:#fff;color:var(--ink);border:1.5px solid var(--line);min-height:44px;padding:8px 6px;font-size:14px}
.seg button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.sum{padding:14px 0 4px;font-size:15px}.sum div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.total{display:flex;justify-content:space-between;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;padding:6px 0 12px}
.f{margin-top:12px}.f label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.f input,.f textarea{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.send{width:100%;margin-top:18px;background:#128C4B;color:#fff;min-height:54px;font-size:17px}
.send:disabled{opacity:.5;cursor:not-allowed}
.how{font-size:14px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.4}
.clear{display:block;margin:10px auto 0;background:transparent;color:var(--muted);font-weight:500;min-height:40px;font-size:14px;text-decoration:underline}
.warn{background:#FFF1CC;color:#6B4E00;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:14px}
.err{color:#B3261E;font-size:14px;margin-top:10px;text-align:center}
.rimg{width:100%;display:block;border-radius:14px;border:1px solid var(--line);margin-bottom:6px}
</style>
</head>
<body>
<div id="app"><div class="state"><p>Loading menu…</p></div></div>
<button class="cartbar hidden" id="bar" data-a="open"></button>
<div id="host"></div>

<script src="config.js"></script>
<script src="receipt.js"></script>
<script>
const API = window.APP_CONFIG.API_URL;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const route = location.hash.match(/^#\/r\/([a-z0-9-]+)(?:\/t\/([^/]+))?/i);
const slug = route && route[1].toLowerCase();
const table = route && route[2] ? decodeURIComponent(route[2]).slice(0, 20) : '';
const tableText = (t) => (/^\d+$/.test(t) ? 'Table ' + t : t);
let D = null, cart = {}, opt = null, stars = 0;
const form = { type: '', name: '', table, phone: '', address: '', note: '' };
const CK = 'cart:' + slug, TAGNAMES = { spicy: 'Spicy', veg: 'Veg', halal: 'Halal', special: "Chef's special" };

/* ---------- helpers ---------- */
const money = (n) => D.restaurant.currency + ' ' + Number(n).toLocaleString();
const byId = (id) => D.items.find((i) => i.id == id);
const isOpen = () => D.restaurant.status.open;
const hasOpts = (i) => i.sizes.length || i.addons.length;
const onColor = (hex) => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 160 ? '#14211F' : '#FFFFFF'; };
const save = () => { try { localStorage.setItem(CK, JSON.stringify(cart)); } catch (e) {} };
const keyOf = (id, s, a) => `${id}|${s}|${a.join('.')}`;
function line(key) {
  const [id, s, a] = key.split('|'), it = byId(id); if (!it) return null;
  const size = s === '-1' ? null : it.sizes[+s]; if (s !== '-1' && !size) return null;
  const adds = a ? a.split('.').map((k) => it.addons[+k]) : []; if (adds.some((x) => !x)) return null;
  const unit = (size ? size.price : it.price) + adds.reduce((t, x) => t + x.price, 0);
  return { it, unit, label: [size && size.name, ...adds.map((x) => '+ ' + x.name)].filter(Boolean).join(', ') };
}
const lines = () => Object.entries(cart).map(([k, q]) => ({ k, q, ...line(k) })).filter((l) => l.it);
const count = () => lines().reduce((a, l) => a + l.q, 0);
const subtotal = () => lines().reduce((a, l) => a + l.unit * l.q, 0);
const itemCount = (id) => lines().filter((l) => l.it.id == id).reduce((a, l) => a + l.q, 0);
const feeNow = () => (form.type === 'delivery' ? D.restaurant.delivery_fee : 0);

function applyTheme(r) {
  const st = document.documentElement.style;
  st.setProperty('--brand', r.primary); st.setProperty('--on-brand', onColor(r.primary));
  st.setProperty('--accent', r.accent); st.setProperty('--on-accent', onColor(r.accent));
  $('themeMeta').content = r.primary; document.title = r.name + ' - Menu';
}

/* ---------- menu page ---------- */
function ctrl(i) {
  if (!i.is_available) return '<span class="sold">Sold out</span>';
  if (!isOpen()) return '';
  if (hasOpts(i)) { const n = itemCount(i.id);
    return `${n ? `<span class="inord">${n} in order</span>` : ''}<button class="add" data-a="opt" data-id="${i.id}">${n ? 'Add more' : 'Add'}</button>`; }
  const q = cart[keyOf(i.id, -1, [])] || 0, k = keyOf(i.id, -1, []);
  return q ? `<div class="step"><button data-a="dec" data-k="${k}" aria-label="Remove one">−</button><b>${q}</b><button data-a="inc" data-k="${k}" aria-label="Add one more">+</button></div>`
           : `<button class="add" data-a="inc" data-k="${k}">Add</button>`;
}
function priceHtml(i) {
  if (i.sizes.length) return `<span class="price"><span class="from">From </span>${esc(money(i.price))}</span>`;
  return `<span class="price">${esc(money(i.price))}${i.old_price ? `<span class="old">${esc(money(i.old_price))}</span>` : ''}</span>`;
}
function dish(i) {
  const off = i.old_price && !i.sizes.length ? Math.round((1 - i.price / i.old_price) * 100) : 0;
  const tags = [...i.tags.filter((t) => TAGNAMES[t]).map((t) => `<span class="${t}">${TAGNAMES[t]}</span>`), off > 0 ? `<span class="special">${off}% off</span>` : ''].join('');
  return `<article class="dish ${i.is_available ? '' : 'off'}" data-name="${esc((i.name + ' ' + (i.description || '')).toLowerCase())}">
    ${i.image_url ? `<img class="pic" loading="lazy" alt="" src="${esc(API + i.image_url)}">` : ''}
    <div class="info"><h3>${esc(i.name)}</h3>${i.description ? `<p class="desc">${esc(i.description)}</p>` : ''}${tags ? `<div class="tg">${tags}</div>` : ''}
    <div class="foot">${priceHtml(i)}<span id="c${i.id}">${ctrl(i)}</span></div></div></article>`;
}
function render() {
  const R = D.restaurant, secs = D.categories.map((c) => [c.id, c.name, D.items.filter((i) => i.category_id === c.id)]).filter((s) => s[2].length);
  const other = D.items.filter((i) => !D.categories.some((c) => c.id === i.category_id));
  if (other.length) secs.push(['x', secs.length ? 'More' : 'Menu', other]);
  const st = R.status;
  $('app').innerHTML = `<header class="top"><div class="wrap"><h1>${esc(R.name)}</h1><p>${isOpen() ? 'Pick your dishes and send your order on WhatsApp.' : 'Have a look at our menu.'}</p>
    <div class="hrow">${table ? `<span class="tbl">${esc(tableText(table))}</span>` : ''}
    ${table && R.whatsapp && isOpen() ? '<button class="wait" data-a="waiter">Call waiter</button>' : ''}</div></div></header>
    <div class="sticky"><div class="wrap"><input class="search" id="q" type="search" placeholder="Search the menu" aria-label="Search the menu">
    ${secs.length > 1 ? `<div class="chips">${secs.map((s) => `<button class="chip" data-a="go" data-id="s${s[0]}">${esc(s[1])}</button>`).join('')}</div>` : ''}</div></div>
    <main class="wrap">${isOpen() ? '' : `<div class="closed"><b>${st.text === 'Temporarily closed' ? 'Temporarily closed' : 'Closed right now'}</b>${st.text === 'Temporarily closed' ? 'Ordering is paused for the moment.' : esc(st.text) + '. Ordering is paused until then.'}</div>`}
    ${secs.map((s) => `<section id="s${s[0]}"><h2>${esc(s[1])}</h2>${s[2].map(dish).join('')}</section>`).join('')}
    <div class="state hidden" id="none"><h2>Nothing found</h2><p>Try a different word.</p></div>
    ${secs.length ? '' : '<div class="state"><h2>Menu coming soon</h2><p>This restaurant has not added any dishes yet.</p></div>'}
    <div class="fb" id="fb"></div></main>`;
  $('q').addEventListener('input', search);
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting)
    document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c.dataset.id === e.target.id)); }), { rootMargin: '-130px 0px -70% 0px' });
  document.querySelectorAll('section').forEach((s) => io.observe(s));
  fbPaint(); bar();
}
function search() {
  const t = $('q').value.trim().toLowerCase(); let any = false;
  document.querySelectorAll('section').forEach((s) => { let v = 0;
    s.querySelectorAll('.dish').forEach((d) => { const ok = !t || d.dataset.name.includes(t); d.classList.toggle('hidden', !ok); if (ok) v++; });
    s.classList.toggle('hidden', !v); if (v) any = true; });
  $('none').classList.toggle('hidden', any);
}
function bar() {
  const n = count(), show = n && isOpen() && !$('host').innerHTML;
  $('bar').classList.toggle('hidden', !show);
  $('bar').innerHTML = `<span>${n} item${n === 1 ? '' : 's'} in your order<b>${esc(money(subtotal()))}</b></span><i>View order</i>`;
}
function paintItem(id) { const el = $('c' + id); if (el) el.innerHTML = ctrl(byId(id)); }
function setQty(k, d) {
  const q = Math.max(0, (cart[k] || 0) + d); if (q) cart[k] = q; else delete cart[k];
  save(); paintItem(k.split('|')[0]);
  if ($('host').dataset.sheet === 'order') orderSheet(); else bar();
}

/* ---------- options sheet (sizes and add-ons) ---------- */
function optSheet(id) {
  const i = byId(id); if (!opt || opt.id !== id) opt = { id, size: 0, adds: [] };
  const unit = (i.sizes.length ? i.sizes[opt.size].price : i.price) + opt.adds.reduce((t, k) => t + i.addons[k].price, 0);
  $('host').dataset.sheet = 'opt';
  $('host').innerHTML = `<div class="back" data-a="shut"><div class="sheet" role="dialog" aria-label="${esc(i.name)}">
    <div class="hd"><h2>${esc(i.name)}</h2><button class="x" data-a="close">Close</button></div>
    ${i.description ? `<p style="color:var(--muted);font-size:14px">${esc(i.description)}</p>` : ''}
    ${i.sizes.length ? `<p class="lbl">Choose a size</p>${i.sizes.map((s, k) => `<button class="optrow ${opt.size === k ? 'on' : ''}" data-a="osize" data-i="${k}"><span>${esc(s.name)}</span><b>${esc(money(s.price))}</b></button>`).join('')}` : ''}
    ${i.addons.length ? `<p class="lbl">Extras (optional)</p>${i.addons.map((s, k) => `<button class="optrow ${opt.adds.includes(k) ? 'on' : ''}" data-a="oadd" data-i="${k}"><span>${esc(s.name)}</span><b>+ ${esc(money(s.price))}</b></button>`).join('')}` : ''}
    <button class="send" style="background:var(--brand);color:var(--on-brand)" data-a="oconfirm">Add to order · ${esc(money(unit))}</button></div></div>`;
  $('bar').classList.add('hidden');
}

/* ---------- order sheet ---------- */
function types() { const R = D.restaurant; return [R.dinein && ['dinein', 'Dine in'], R.takeaway && ['takeaway', 'Takeaway'], R.delivery && ['delivery', 'Delivery']].filter(Boolean); }
function readForm() { ['name', 'table', 'phone', 'address', 'note'].forEach((k) => { const e = $('f_' + k); if (e) form[k] = e.value; }); }
function orderSheet() {
  if (!count()) { closeSheet(); return; }
  readForm();
  const T = types(); if (!T.find((t) => t[0] === form.type)) form.type = (table && T.find((t) => t[0] === 'dinein')) ? 'dinein' : T[0][0];
  const R = D.restaurant, sub = subtotal(), fee = feeNow(), below = form.type === 'delivery' && R.min_order && sub < R.min_order;
  const field = (id, label, extra) => `<div class="f"><label for="f_${id}">${label}</label>${extra}</div>`;
  $('host').dataset.sheet = 'order';
  $('host').innerHTML = `<div class="back" data-a="shut"><div class="sheet" role="dialog" aria-label="Your order">
    <div class="hd"><h2>Your order</h2><button class="x" data-a="close">Close</button></div>
    ${lines().map((l) => `<div class="line"><div class="n"><b>${esc(l.it.name)}</b><small>${l.label ? esc(l.label) + ' · ' : ''}${esc(money(l.unit))} each</small></div>
      <div class="step"><button data-a="dec" data-k="${l.k}" aria-label="Remove one">−</button><b>${l.q}</b><button data-a="inc" data-k="${l.k}" aria-label="Add one more">+</button></div></div>`).join('')}
    ${T.length > 1 ? `<div class="seg">${T.map((t) => `<button class="${form.type === t[0] ? 'on' : ''}" data-a="otype" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>` : ''}
    <div class="sum"><div><span>Items</span><span>${esc(money(sub))}</span></div>${fee ? `<div><span>Delivery fee</span><span>${esc(money(fee))}</span></div>` : ''}</div>
    <div class="total"><span>Total</span><span>${esc(money(sub + fee))}</span></div>
    ${below ? `<p class="warn">The minimum order for delivery is ${esc(money(R.min_order))}. Please add ${esc(money(R.min_order - sub))} more.</p>` : ''}
    ${field('name', 'Your name' + (form.type === 'delivery' ? '' : ' (optional)'), `<input id="f_name" value="${esc(form.name)}" autocomplete="name">`)}
    ${form.type === 'dinein' ? field('table', 'Table or room number (optional)', `<input id="f_table" value="${esc(form.table)}">`) : ''}
    ${form.type !== 'dinein' ? field('phone', 'Phone number' + (form.type === 'delivery' ? '' : ' (optional)'), `<input id="f_phone" type="tel" inputmode="tel" value="${esc(form.phone)}" autocomplete="tel">`) : ''}
    ${form.type === 'delivery' ? field('address', 'Delivery address', `<textarea id="f_address" rows="2" autocomplete="street-address">${esc(form.address)}</textarea>`) : ''}
    ${field('note', 'Anything to tell the kitchen? (optional)', `<textarea id="f_note" rows="2" placeholder="e.g. less spicy">${esc(form.note)}</textarea>`)}
    ${R.whatsapp && isOpen() ? `<button class="send" data-a="send" ${below ? 'disabled' : ''}>Send order on WhatsApp</button>
      <p class="how">WhatsApp will open with your order already written. Just tap the send button there. You can save a receipt afterwards.</p><p class="err" id="sendErr" role="alert"></p>`
      : `<p class="warn">${!isOpen() ? 'This restaurant is closed right now, so orders cannot be sent.' : 'This restaurant has not set up WhatsApp ordering yet. Please show this list to the staff.'}</p>`}
    <button class="clear" data-a="clear">Clear my order</button></div></div>`;
  $('bar').classList.add('hidden');
}
function closeSheet() { $('host').innerHTML = ''; $('host').dataset.sheet = ''; opt = null; bar(); }
async function send() {
  readForm();
  const R = D.restaurant, err = (t) => { const e = $('sendErr'); if (e) e.textContent = t; };
  if (form.type === 'delivery' && (!form.name.trim() || !form.phone.trim() || !form.address.trim())) return err('Please fill in your name, phone number and address for delivery.');
  if (form.type === 'delivery' && R.min_order && subtotal() < R.min_order) return err('Your order is below the minimum for delivery.');
  try { localStorage.setItem('cust', JSON.stringify({ name: form.name, phone: form.phone, address: form.address })); } catch (e) {}
  const btn = document.querySelector('.send[data-a="send"]'); btn.disabled = true; btn.textContent = 'Sending…'; err('');
  const payload = { type: form.type, name: form.name.trim(), table: form.table.trim(), phone: form.phone.trim(), address: form.address.trim(), note: form.note.trim(),
    lines: lines().map((l) => { const [id, s, a] = l.k.split('|'); return { id: +id, size: +s, addons: a ? a.split('.').map(Number) : [], qty: l.q }; }) };
  let order = null;
  try {   // the restaurant's system records the order and recalculates the prices
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 7000);
    const res = await fetch(API + '/api/public/order/' + slug, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: ctl.signal });
    clearTimeout(to);
    const j = await res.json().catch(() => ({}));
    if (res.ok) order = j.order;
    else if (res.status < 500) { btn.disabled = false; btn.textContent = 'Send order on WhatsApp'; return err(j.error || 'Could not place the order.'); }
  } catch (e) { /* network problem: the customer can still send the WhatsApp message */ }
  if (!order) order = localOrder();
  const label = { dinein: 'Dine in', takeaway: 'Takeaway', delivery: 'Delivery' }[order.type], m = (n) => money(n);
  const msg = [`*New order${order.code ? ' #' + order.code : ''} - ${R.name}*`, `Order type: ${label}`,
    order.table ? `Table: ${order.table}` : null, order.name ? `Name: ${order.name}` : null, order.phone ? `Phone: ${order.phone}` : null,
    order.type === 'delivery' ? `Address: ${order.address}` : null, '',
    ...order.items.map((i) => `${i.qty} x ${i.name}${i.label ? ' (' + i.label + ')' : ''} - ${m(i.total)}`), '',
    order.fee ? `Items: ${m(order.subtotal)}` : null, order.fee ? `Delivery fee: ${m(order.fee)}` : null,
    `*Total: ${m(order.total)}*`, order.note ? `Note: ${order.note}` : null].filter((x) => x !== null).join('\n');
  try { localStorage.setItem(PK, JSON.stringify({ order, at: Date.now() })); } catch (e) {}
  setTimeout(maybeReceipt, 3000);   // if WhatsApp did not take over the screen, show the receipt anyway
  location.href = 'https://wa.me/' + R.whatsapp + '?text=' + encodeURIComponent(msg);
}
function localOrder() {
  const R = D.restaurant, fee = feeNow(), sub = subtotal();
  return { code: '', created_at: new Date().toISOString().slice(0, 19).replace('T', ' '), type: form.type, table: form.type === 'dinein' ? form.table.trim() : '',
    name: form.name.trim(), phone: form.type !== 'dinein' ? form.phone.trim() : '', address: form.type === 'delivery' ? form.address.trim() : '', note: form.note.trim(),
    items: lines().map((l) => ({ name: l.it.name, label: l.label, qty: l.q, unit: l.unit, total: l.unit * l.q })), subtotal: sub, fee, total: sub + fee, currency: R.currency, restaurant: R.name };
}

/* ---------- receipt popup (shown when the customer comes back from WhatsApp) ---------- */
const PK = 'pend:' + slug; let rcptOpen = false, RC = null, RO = null;
function receiptDoc(o) {
  const R = D.restaurant, m = (n) => o.currency + ' ' + Receipt.num(n);
  return { brand: o.restaurant || R.name, accent: R.primary, title: 'Order receipt', subtitle: o.code ? 'Order #' + o.code : 'Order summary',
    meta: [['Date', Receipt.when(o.created_at)], ['Order type', { dinein: 'Dine in', takeaway: 'Takeaway', delivery: 'Delivery' }[o.type]],
      ['Table', o.table], ['Name', o.name], ['Phone', o.phone], ['Address', o.address]],
    sections: [{ title: 'Your order', rows: o.items.map((i) => ({ a: i.qty + ' x ' + i.name, b: m(i.total), sub: i.label })) }],
    totals: [...(o.fee ? [['Items', m(o.subtotal)], ['Delivery fee', m(o.fee)]] : []), ['Total', m(o.total), true]],
    footer: 'Thank you! This receipt shows the order you sent to the restaurant on WhatsApp. Please keep it as your record.' };
}
function maybeReceipt() {
  if (rcptOpen || !D || document.visibilityState === 'hidden') return;
  let p = null; try { p = JSON.parse(localStorage.getItem(PK) || 'null'); } catch (e) {}
  if (!p || Date.now() - p.at > 6 * 3600e3) { try { localStorage.removeItem(PK); } catch (e) {} return; }
  showReceipt(p.order);
}
function showReceipt(o) {
  rcptOpen = true; RO = o; cart = {}; save(); D.items.forEach((i) => paintItem(i.id));
  RC = Receipt.draw(receiptDoc(o));
  $('host').dataset.sheet = 'receipt';
  $('host').innerHTML = `<div class="back" data-a="rshut"><div class="sheet" role="dialog" aria-label="Your receipt">
    <div class="hd"><h2>Your receipt</h2><button class="x" data-a="rclose">Close</button></div>
    <p class="how" style="margin:0 0 12px;text-align:left">If WhatsApp has not sent your message yet, go back and tap send there. Save this receipt as your record.</p>
    <img class="rimg" alt="Order receipt" src="${RC.toDataURL('image/jpeg', 0.9)}">
    <button class="send" style="background:var(--brand);color:var(--on-brand)" data-a="rdl">Download receipt (JPG)</button>
    ${Receipt.canShareFiles() ? '<button class="send" style="background:#fff;color:var(--brand);border:1.5px solid var(--brand);margin-top:10px" data-a="rshare">Share or save to Photos</button>' : ''}</div></div>`;
  $('bar').classList.add('hidden');
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(maybeReceipt, 300); });
window.addEventListener('pageshow', () => setTimeout(maybeReceipt, 300));

/* ---------- feedback ---------- */
const FBK = 'fb:' + slug;
function fbPaint() {
  const el = $('fb'); if (!el) return;
  let done = false; try { done = Date.now() - Number(localStorage.getItem(FBK) || 0) < 12 * 3600e3; } catch (e) {}
  if (done) { el.innerHTML = '<h2>Thank you!</h2><p>We appreciate your feedback.</p>'; return; }
  el.innerHTML = `<h2>How was your visit?</h2><p>Tap a star to rate us.</p>
    <div class="stars">${[1, 2, 3, 4, 5].map((n) => `<button class="${n <= stars ? 'on' : ''}" data-a="star" data-id="${n}" aria-label="${n} star${n > 1 ? 's' : ''}">★</button>`).join('')}</div>
    ${stars ? '<textarea id="fbc" rows="2" maxlength="300" placeholder="Tell us more (optional)"></textarea><button data-a="fbsend">Send feedback</button><p class="err" id="fbe"></p>' : ''}`;
}
async function fbSend() {
  try {
    const res = await fetch(API + '/api/public/feedback/' + slug, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rating: stars, comment: $('fbc').value, t: table }) });
    if (!res.ok) throw 0;
    try { localStorage.setItem(FBK, String(Date.now())); } catch (e) {}
    fbPaint();
  } catch (e) { $('fbe').textContent = 'Could not send. Please try again.'; }
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if ((a === 'shut' || a === 'rshut') && e.target !== el) return;
  if (a === 'inc') setQty(el.dataset.k, 1); else if (a === 'dec') setQty(el.dataset.k, -1);
  else if (a === 'open') orderSheet(); else if (a === 'close' || a === 'shut') closeSheet();
  else if (a === 'rclose' || a === 'rshut') { try { localStorage.removeItem(PK); } catch (er) {} rcptOpen = false; closeSheet(); }
  else if (a === 'rdl') Receipt.saveJpg(RC, 'receipt-' + (RO.code || 'order'));
  else if (a === 'rshare') Receipt.share(RC, 'receipt-' + (RO.code || 'order'));
  else if (a === 'opt') optSheet(id);
  else if (a === 'osize') { opt.size = +el.dataset.i; optSheet(opt.id); }
  else if (a === 'oadd') { const k = +el.dataset.i, p = opt.adds.indexOf(k); if (p < 0) opt.adds.push(k); else opt.adds.splice(p, 1); opt.adds.sort((x, y) => x - y); optSheet(opt.id); }
  else if (a === 'oconfirm') { const i = byId(opt.id), k = keyOf(i.id, i.sizes.length ? opt.size : -1, opt.adds); cart[k] = (cart[k] || 0) + 1; save(); paintItem(i.id); closeSheet(); }
  else if (a === 'otype') { readForm(); form.type = id; orderSheet(); }
  else if (a === 'send') send();
  else if (a === 'clear') { if (confirm('Remove everything from your order?')) { cart = {}; save(); D.items.forEach((i) => paintItem(i.id)); closeSheet(); } }
  else if (a === 'go') { const s = $(id); if (s) { $('q').value = ''; search(); s.scrollIntoView({ behavior: 'smooth' }); } }
  else if (a === 'waiter') location.href = 'https://wa.me/' + D.restaurant.whatsapp + '?text=' + encodeURIComponent(`${tableText(table)} is calling a waiter. (${D.restaurant.name})`);
  else if (a === 'star') { stars = +id; fbPaint(); }
  else if (a === 'fbsend') fbSend();
});

/* ---------- start ---------- */
(async function () {
  const fail = (t, p) => { $('app').innerHTML = `<div class="state"><h2>${t}</h2><p>${p}</p></div>`; };
  if (!slug) return fail('Menu not found', 'Please scan the QR code again.');
  try {
    const res = await fetch(API + '/api/public/menu/' + slug);
    if (res.status === 404) return fail('Menu not available', 'This menu is not available right now.');
    if (!res.ok) throw 0;
    D = await res.json();
  } catch (e) { return fail('Could not load the menu', 'Check your internet connection and try again.'); }
  applyTheme(D.restaurant);
  try { const c = JSON.parse(localStorage.getItem('cust') || '{}'); form.name = c.name || ''; form.phone = c.phone || ''; form.address = c.address || ''; } catch (e) {}
  try { const s = JSON.parse(localStorage.getItem(CK) || '{}');
    Object.entries(s).forEach(([k, q]) => { const l = line(k); if (l && l.it.is_available && q > 0) cart[k] = q; }); } catch (e) {}
  render(); maybeReceipt();
  try { if (!sessionStorage.getItem('sc:' + slug)) { sessionStorage.setItem('sc:' + slug, '1');
    fetch(API + '/api/public/scan/' + slug, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: table }) }).catch(() => {}); } } catch (e) {}
})();
</script>
